services:
  postgres:
    image: postgres:16-alpine
    container_name: indexer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: indexer
    ports:
      - "5432:5432"
    volumes:
      - indexer_pg_data:/var/lib/postgresql/data

volumes:
  indexer_pg_data:
